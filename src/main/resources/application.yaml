spring:
  application:
    name: desk-resolver

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ITSoftwareSupport}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      schema: desk_resolver_db

  # ---------------------------------------------------------------------------
  # Flyway
  # ---------------------------------------------------------------------------
  # The `auth` schema is NOT listed here. V17 creates it itself with CREATE SCHEMA,
  # so the connection search_path stays desk_resolver_db alone and every reference to
  # an auth table - in migrations and in @Table(schema = "auth") - is qualified
  # explicitly. Nothing resolves by search_path order, which is one less thing that
  # can differ between a developer machine and a deployment.
  flyway:
    schemas: desk_resolver_db
    default-schema: desk_resolver_db
    locations: classpath:db/migration

  # ---------------------------------------------------------------------------
  # JPA / Hibernate
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server:
  port: 9211

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
app:
  security:
    jwt:
      # Required. With no secret the application REFUSES TO START, because a generated
      # key fails silently: tokens work until a restart, then stop, and never validate
      # on a second instance.
      # Minimum 32 bytes.
      secret: ${APP_JWT_SECRET:}
      # Single developer machine escape hatch: generate a random key per JVM instead of
      # failing. Every token dies on restart. Never enable this anywhere shared.
      allow-generated-secret: ${APP_JWT_ALLOW_GENERATED_SECRET:false}
      issuer: desk-resolver
      # Access-token lifetime. Keep it SHORT - this is how long a leaked token is usable for, and
      # since refresh tokens exist there is no longer any reason to lengthen it for convenience.
      ttl: 30m

    # -------------------------------------------------------------------------
    # Refresh tokens
    # -------------------------------------------------------------------------
    # How long somebody may keep working without typing their password again - a different question
    # from jwt.ttl above, which is how long one access token lives.
    #
    # 8h is one working shift: sign in on arrival, sign in again tomorrow. ABSOLUTE, not sliding -
    # SessionService.rotate copies the expiry forward unchanged, so a chain dies this long after the
    # login that started it however many times it refreshes.
    #
    # 7d (the usual default elsewhere) was rejected: it leaves a live credential in browser storage
    # overnight and over a weekend to save one login a week.
    refresh:
      ttl: ${APP_REFRESH_TTL:8h}

    # Exact browser origins allowed to call the API.
    cors:
      allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200}
      allow-credentials: false

    # Whether /v3/api-docs and /swagger-ui/** are reachable without a token.
    # Default false: the document enumerates every endpoint, its parameters and the
    # permission each one asserts, which is a map of the application's attack surface.
    # Set APP_SWAGGER_PUBLIC=true for local development or a demo environment.
    swagger-public: ${APP_SWAGGER_PUBLIC:true}

    # -------------------------------------------------------------------------
    # Bootstrap administrator
    # -------------------------------------------------------------------------
    # Creates one ADMIN on first start only if no administrator exists
    # and the required values are supplied.
    bootstrap-admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
      full-name: ${APP_BOOTSTRAP_ADMIN_NAME:Bootstrap Administrator}

    # -------------------------------------------------------------------------
    # Sessions
    # -------------------------------------------------------------------------
    # A session is the server-side record of one issued access token (auth.sessions),
    # and the reason a token can be revoked before it expires.
    #
    # Its lifetime is NOT configurable here: it is jwt.ttl above, because a session
    # exists to describe one token and the two expiring at different times would mean
    # either a token nothing can revoke or a session nothing can use.
    session:
      # How long an ended session is kept before being deleted. Expired rows are not
      # removed on expiry, so there is something to look at when asking which sessions
      # existed around an incident.
      retention: ${APP_SESSION_RETENTION:P7D}
      # How often the purge runs. ISO-8601; read directly by @Scheduled.
      purge-interval: ${APP_SESSION_PURGE_INTERVAL:PT1H}

    # -------------------------------------------------------------------------
    # Login rate limiting
    # -------------------------------------------------------------------------
    rate-limit:
      enabled: ${APP_RATE_LIMIT_ENABLED:true}
      max-account-failures: 5
      max-address-failures: 20
      window: 15m
      block-duration: 15m
      max-tracked-keys: 50000

      # Only enable when running behind a trusted reverse proxy
      # that correctly appends X-Forwarded-For.
      trust-forwarded-headers: ${APP_TRUST_FORWARDED_HEADERS:false}

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
app.notifications:
  # How often to look for tickets whose deadline has passed. ISO-8601, read directly by @Scheduled.
  #
  # Every other notification is written by the request that caused it. Nobody causes a deadline to
  # pass, so this is the only one that has to be noticed - and the interval is how late an
  # announcement can be, not how often anybody is told: the event key carries the deadline, so one
  # ticket passing one deadline is announced exactly once however many scans see it.
  #
  # An hour, because these are business deadlines measured in days. Shortening it buys promptness
  # nobody asked for and costs a query per interval.
  #
  # NOT SAFE ON MORE THAN ONE INSTANCE as it stands - OverdueTicketScanner says what it would need.
  overdue-scan-interval: ${APP_OVERDUE_SCAN_INTERVAL:PT1H}

# ---------------------------------------------------------------------------
# Attachment storage
# ---------------------------------------------------------------------------
app.storage:
  attachments:
    # Where uploaded files are written. The default is relative to the working
    # directory, which suits a developer machine and nothing else: a container would
    # lose every file on restart, and two instances would not see each other's uploads.
    # Set this to durable, shared storage in any real deployment - or replace
    # LocalAttachmentStorage with an object-store implementation of AttachmentStorage,
    # which is what the interface exists for.
    directory: ${APP_ATTACHMENT_DIR:./data/attachments}

    # Per-file ceiling enforced by the application, which answers 400 with the limit
    # in the message. Keep it below spring.servlet.multipart.max-file-size below, so
    # the readable error is the one a client normally meets.
    max-file-size: ${APP_ATTACHMENT_MAX_FILE_SIZE:10MB}

    # Allow-list of accepted content types. An unlisted type is refused: this fails
    # closed, unlike a deny-list, which has to be complete to work at all.
    #
    # NOTE: the value matched is the Content-Type the client sent, not the file's
    # actual contents - nothing is sniffed. That is why downloads are always served
    # as Content-Disposition: attachment, never inline.
    allowed-content-types:
      - image/png
      - image/jpeg
      - image/gif
      - image/webp
      - application/pdf
      - text/plain
      - text/csv
      - application/zip
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet

# ---------------------------------------------------------------------------
# Multipart
# ---------------------------------------------------------------------------
# The container-level backstop. Deliberately a little above the application's own
# limit: this one stops an enormous body from being buffered at all and answers 413
# with no knowledge of the application, while the smaller app limit produces the 400
# that names the real ceiling.
spring.servlet.multipart:
  max-file-size: ${APP_MULTIPART_MAX_FILE_SIZE:12MB}
  max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:13MB}
